<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando...</title>
  <script>
    sessionStorage.redirect = location.pathname;
    var parts = location.pathname.split('/').filter(Boolean);
    parts.pop();
    location.replace('/' + (parts.length ? parts.join('/') + '/' : ''));
  </script>
  <style>
    body { margin: 0; background: #0e142e; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: system-ui, sans-serif; color: #fff; }
    p { opacity: 0.7; font-size: 0.9rem; }
  </style>
</head>
<body><p>Redirecionando...</p></body>
</html>
